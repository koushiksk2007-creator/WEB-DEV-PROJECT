<!DOCTYPE html>
<html>
<head>
  <style>
   
    .navbar {
      display: flex;
      justify-content: space-between; 
      background-color: black;
      padding: 15px;
    }
    
    .logo { color: white; }
    .links a { color: white; margin-left: 15px; }

  
    .card-container {
      display: flex;
      flex-wrap: wrap;       
      justify-content: center; 
      gap: 20px;           
      padding: 20px;
    }

    
    .card {
      width: 250px;        
      background-color: lightgray;
      padding: 20px;
    }
  </style>
</head>
<body>

  
  <div class="navbar">
    <div class="logo">My Logo</div>
    <div class="links">
      <a href="#">Home</a>
      <a href="#">About</a>
    </div>
  </div>


  <div class="card-container">
    <div class="card">
      <h3>Card 1</h3>
      <p> text here.</p>
    </div>
    <div class="card">
      <h3>Card 2</h3>
      <p>Simple text here.</p>
    </div>
    <div class="card">
      <h3>Card 3</h3>
      <p> text here.</p>
    </div>
  </div>

</body>
</html>
